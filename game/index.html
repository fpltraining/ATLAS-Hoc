<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2140">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ConnectLife Town</title>
<meta name="description" content="Học tiếng Anh bằng cách sống trong thành phố Brightford: học ở trường, nói chuyện ở quán, đi khắp phố. Mỗi ngày app giao đủ phần cần học để nói, đọc hiểu và nghe trôi chảy.">
<meta property="og:title" content="ConnectLife · Học tiếng Anh ở Brightford">
<meta property="og:description" content="Học ở trường, nói chuyện ở quán, đi khắp phố. Mỗi ngày học đủ phần để nói, đọc hiểu và nghe trôi chảy tiếng Anh.">
<meta property="og:image" content="assets/lobby_hero.webp">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/game.css">
<script src="data/asset_rev.js"></script>
<script>/* điện thoại (cạnh ngắn < 600 px, màn cảm ứng): app chạy ngang, cầm dọc thì hiện lời nhắc xoay ngang */
(function () { var s = Math.min(screen.width, screen.height); if (s < 600 && (navigator.maxTouchPoints > 0 || 'ontouchstart' in window)) document.documentElement.className += ' phone'; })();</script>
</head>
<body>
  <!-- Điện thoại cầm dọc: nhắc xoay ngang (iPhone không cho web app tự khoá màn hình ngang) -->
  <div id="rotate" class="rotate" aria-live="polite">
    <img id="rot-img" class="rot-img" alt="">
    <b>Xoay ngang điện thoại nhé</b>
    <p>ConnectLife chơi trên màn hình ngang để thấy rộng cả thành phố.</p>
    <small>Xoay mà màn hình không đổi? Vuốt từ góc trên bên phải xuống để mở Trung tâm điều khiển, tắt nút 🔒 Khoá xoay màn hình rồi xoay lại.</small>
  </div>
  <!-- Màn chờ lúc mở app (hình anh Han đặt): tắt dần khi app sẵn sàng -->
  <div id="splash" class="splash" aria-hidden="true"><img id="sp-title" class="sp-title" alt=""></div>
  <script>(function () {
    var R = (window.G && G.ASSET_REV) || {}, u = function (n) { return 'assets/' + n + (R[n] ? '?v=' + R[n] : ''); };
    document.getElementById('rot-img').src = u('kai_rotate.png');
    document.getElementById('splash').style.backgroundImage = 'radial-gradient(ellipse 60% 42% at 50% 16%, rgba(246,239,226,.92), rgba(246,239,226,0)), url(' + u('splash.webp') + ')';
    document.getElementById('sp-title').src = u('lobby_title.png');
  })();</script>
  <!-- Ngôi nhà chung -->
  <main id="lobby"></main>

  <!-- Tạo nhân vật -->
  <main id="create" style="display:none"></main>

  <!-- Bản đồ -->
  <section id="play" style="display:none">
    <canvas id="world3d" style="display:none"></canvas>
    <div id="sky3d" class="sky3d" style="display:none"></div>
    <div id="glare3d" class="glare3d" style="display:none"></div>
    <div id="tilt3d" class="tilt3d" style="display:none"></div>
    <canvas id="world"></canvas>
    <div class="hud">
      <button id="hud-home" class="hud-btn" aria-label="Về Ngôi nhà chung"><img class="ic3" data-asset="ic3_house.webp" alt=""></button>
      <b id="hud-title"></b>
      <span id="hud-xp" class="hud-xp"></span>
    </div>
    <div id="radar" class="radar"><canvas id="radar-cv" aria-label="Radar, la bàn"></canvas><button id="temp" class="temp" aria-label="Nhiệt độ ngoài trời"></button></div>
    <button id="quest" class="quest"><span class="q-pin"><img class="ic3" data-asset="ic3_pin.webp" alt=""></span><span><small>Việc tiếp theo</small><b id="quest-text"></b></span><span class="q-go">Đi ›</span></button>
    <div id="joy" class="joy" aria-label="Cần điều khiển"><div id="joy-knob" class="joy-knob"></div></div>
    <button id="act" class="act"></button>
    <div id="kai" class="kai" role="button" aria-label="Lời Kai, chạm để đọc hết"><div class="kai-face"><img data-asset="kai_follow.png" alt=""></div><div id="kai-text" class="kai-text"></div></div>
  </section>

  <!-- Bảng học trong phòng -->
  <div id="panel" class="panel">
    <div class="panel-card">
      <div class="panel-top"><b id="panel-title"></b><button id="panel-py" class="btn sm py-btn" style="display:none"></button><button id="panel-close" class="hud-btn" aria-label="Đóng">✕</button></div>
      <div id="panel-body" class="panel-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/util.js"></script>
  <script src="js/save.js"></script>
  <script src="js/assets.js"></script>

  <script src="data/zh_hsk1.js"></script>

  <script src="js/avatar.js"></script>
  <script src="data/walkmask.js"></script>

  <script src="data/river_en.js"></script>
  <script src="js/world.js"></script>
  <script src="vendor/anime.min.js"></script>
  <script src="vendor/auto-animate.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/grad.js"></script>
  <script src="js/lobby.js"></script>
  <script src="js/create.js"></script>
  <script src="js/ride.js"></script>
  <script src="js/flight.js"></script>

  <script src="data/practice_en.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/memmap.js"></script>
  <script src="js/final.js"></script>
  <script src="js/rank.js"></script>
  <script src="js/floorbadge.js"></script>
  <script src="js/placement.js"></script>
  <script src="data/pron_en.js"></script>
  <script src="js/pron.js"></script>
  <script src="js/music.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/cloud_config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
