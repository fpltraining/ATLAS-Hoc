<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4e9dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dạo phố Brightford</title>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4e9dc; font-family: -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .sky { position: fixed; left: 0; right: 0; top: 0; height: 30vh; pointer-events: none; overflow: hidden; z-index: 1; transition: opacity 1s, filter 1s; }
  .sky img { position: absolute; left: 0; top: 0; will-change: transform; opacity: .72; filter: drop-shadow(0 6px 10px rgba(90,70,40,.12)); }
  .tilt { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 2; -webkit-backdrop-filter: blur(2.5px); backdrop-filter: blur(2.5px); }
  .tilt.top { top: 0; height: 22vh; -webkit-mask-image: linear-gradient(#000 20%, transparent); mask-image: linear-gradient(#000 20%, transparent); }
  .tilt.bot { bottom: 0; height: 8vh; -webkit-mask-image: linear-gradient(transparent, #000 75%); mask-image: linear-gradient(transparent, #000 75%); }
  .vign { position: fixed; inset: 0; pointer-events: none; z-index: 2; background: radial-gradient(ellipse 75% 70% at 50% 55%, rgba(0,0,0,0) 60%, rgba(70,45,15,.22) 100%); }
  .glare { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen; transition: background 1s; }
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); pointer-events: none; z-index: 5; }
  .hud > * { pointer-events: auto; }
  .hb { width: 42px; height: 42px; border-radius: 12px; border: 0; background: rgba(255,250,240,.94); color: #4a2f1d; font-size: 20px; display: grid; place-items: center; text-decoration: none; box-shadow: 0 4px 12px rgba(60,40,20,.2); }
  .ttl { flex: 1; color: #fff; font-weight: 800; font-size: 16px; text-shadow: 0 1px 4px rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clock { display: flex; align-items: center; gap: 8px; background: rgba(27,33,64,.82); color: #fff; border-radius: 14px; padding: 6px 10px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .clock input { width: 130px; accent-color: #ffd56b; }
  .clock button { border: 0; border-radius: 9px; padding: 5px 8px; background: #ffd56b; color: #1b2140; font-weight: 800; font-size: 12px; }
  .clock button.off { background: rgba(255,255,255,.2); color: #fff; }
  .joy { position: fixed; left: max(22px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: 120px; height: 120px; z-index: 6; touch-action: none; opacity: .8; background: center / 100% 100% no-repeat; filter: drop-shadow(0 4px 8px rgba(60,40,20,.25)); }
  .joy.live { opacity: 1; }
  .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; background: center / 100% 100% no-repeat; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(60,40,20,.35)); }
  .act { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(30px, env(safe-area-inset-bottom)); min-height: 52px; padding: 10px 18px; border: 0; border-radius: 16px; background: #c8553d; color: #fff; font-weight: 800; font-size: 16px; box-shadow: 0 8px 20px rgba(0,0,0,.25); transform: translateY(30px); opacity: 0; pointer-events: none; transition: .18s; z-index: 6; }
  .act.show { transform: none; opacity: 1; pointer-events: auto; }
  .toast { position: fixed; left: 50%; bottom: max(96px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(255,250,240,.97); color: #4a2f1d; border-radius: 14px; padding: 10px 16px; font-size: 14px; font-weight: 600; max-width: 80vw; text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,.2); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 7; }
  .toast.show { opacity: 1; }
  .load { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #f4e9dc; color: #7d5a40; font-size: 18px; font-weight: 700; transition: opacity .6s; }
  .load.out { opacity: 0; pointer-events: none; }
  .tip { position: fixed; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 54px); transform: translateX(-50%); background: rgba(255,250,240,.95); color: #4a2f1d; border-radius: 14px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; box-shadow: 0 6px 16px rgba(60,40,20,.18); z-index: 5; max-width: 86vw; text-align: center; transition: opacity .5s; }
  @media (max-height: 500px) { .clock input { width: 90px; } .hb { width: 38px; height: 38px; } .joy { width: 106px; height: 106px; } .act { min-height: 44px; font-size: 14px; bottom: max(14px, env(safe-area-inset-bottom)); } .tip { font-size: 12px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sky" class="sky"></div>
<div id="glare" class="glare"></div>
<div class="tilt top"></div><div class="tilt bot"></div><div class="vign"></div>
<div class="hud">
  <a class="hb" href="./" aria-label="Về game">🏠</a>
  <div id="ttl" class="ttl">Brightford</div>
  <div class="clock"><span id="clk">--:--</span><input id="hr" type="range" min="4" max="23.5" step="0.25" aria-label="Giờ trong ngày"><button id="live">Giờ thật</button></div>
</div>
<div id="tip" class="tip">Bản thử 3D · đi tới đâu, cây cối nhà cửa bật lên tới đó · kéo cần bên trái để đi, chạm mặt đất để tới đó, hai ngón để phóng to thu nhỏ, kéo thanh giờ để xem nắng đổi</div>
<div id="joy" class="joy"><div id="knob" class="knob"></div></div>
<button id="act" class="act"></button>
<div id="toast" class="toast"></div>
<div id="load" class="load">Đang dựng thành phố…</div>

<script src="data/asset_rev.js"></script>

<script src="js/assets.js"></script>
<script src="data/life.js"></script>
<script src="data/life_morning.js"></script>
<script src="data/life_school.js"></script>
<script src="data/life_after.js"></script>

<script src="js/world.js"></script>
<script>
/* Bản thử thành phố 3D kiểu sách pop-up: ba khu (Khu phố Maple · Trung tâm · Phố mua sắm) ghép liền, đi bộ xuyên suốt.
   Nền giấy là mặt đất; nhà, cây, người là tấm giấy dựng đứng (hơi ngả về sau) có bóng đổ theo mặt trời giờ Việt Nam.
   Camera đi theo nhân vật. Người đi đường bước bằng khung hình như nhân vật chính. Dùng lại toàn bộ hình và vị trí của game 2D. */
(function () {
  var U = 0.01;                 // 1 px bản đồ 2D = 0.01 đơn vị 3D
  var LEAN = 0.3;               // tấm giấy ngả về sau (rad) để nhìn từ trên xuống không bị dẹt
  var SPEED = 2.6, STEP = 7;    // tốc độ đi (đơn vị/giây), nhịp bước (khung/giây)
  var DIST = [                  // các khu ghép liền: gốc toạ độ (px) của từng tờ bản đồ
    { id: 'home_en', ox: -1536, oy: 0 },
    { id: 'city_en', ox: 0, oy: 0 },
    { id: 'street_en', ox: 1536, oy: 128 }
  ];
  var cv = document.getElementById('c');
  var R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
  R.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
  R.outputEncoding = THREE.sRGBEncoding;
  var SC = new THREE.Scene();
  SC.fog = new THREE.Fog(0xf3e6cf, 16, 40);
  SC.background = new THREE.Color(0xf3e6cf);
  var CAM = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  var HEMI = new THREE.HemisphereLight(0xfff6e6, 0xc9d6a8, 0.8); SC.add(HEMI);
  var SUN = new THREE.DirectionalLight(0xfff1d6, 0.6);
  SUN.castShadow = true; SUN.shadow.mapSize.set(2048, 2048);
  var shc = SUN.shadow.camera; shc.left = -13; shc.right = 13; shc.top = 13; shc.bottom = -13; shc.near = 1; shc.far = 70;
  SUN.shadow.bias = -0.0006; SUN.shadow.normalBias = 0.02;
  SC.add(SUN); SC.add(SUN.target);

  /* ---------- hình ---------- */
  var manager = new THREE.LoadingManager();
  manager.onLoad = function () { var l = document.getElementById('load'); l.className = 'load out'; setTimeout(function () { l.style.display = 'none'; }, 700); };
  var loader = new THREE.TextureLoader(manager), TEX = {};
  function has(n) { return !!(G.ASSET_REV && G.ASSET_REV[n]); }
  function tex(n) {
    if (TEX[n]) return TEX[n];
    var t = loader.load(G.assetUrl(n)); t.encoding = THREE.sRGBEncoding; t.anisotropy = Math.min(4, R.capabilities.getMaxAnisotropy());
    return (TEX[n] = t);
  }
  var MATS = {}, DMATS = {};
  /* tấm giấy: sáng tối theo nắng nhưng luôn giữ một nền sáng (emissive) để hình không bị tối khi nắng chiếu xiên */
  function mat(n) { return MATS[n] || (MATS[n] = new THREE.MeshLambertMaterial({ map: tex(n), emissive: 0x5a5a5a, emissiveMap: tex(n), alphaTest: 0.5, side: THREE.DoubleSide })); }
  function dmat(n) { return DMATS[n] || (DMATS[n] = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex(n), alphaTest: 0.5 })); }
  var PLANE = new THREE.PlaneGeometry(1, 1); PLANE.translate(0, 0.5, 0);
  /* tấm giấy gấp đôi theo chiều dọc (như cây giấy trong clip anh Han gửi): nếp giữa nhô về phía người xem, hai nửa
     hứng nắng khác nhau nên thấy rõ nếp gấp. depth: độ nhô của nếp (so với bề ngang tấm) */
  function folded(depth) {
    var gm = new THREE.PlaneGeometry(1, 1, 2, 1); gm.translate(0, 0.5, 0);
    var pos = gm.attributes.position;
    for (var i = 0; i < pos.count; i++) if (Math.abs(pos.getX(i)) < 0.01) pos.setZ(i, depth);
    pos.needsUpdate = true; gm.computeVertexNormals(); return gm;
  }
  var FOLD_T = folded(0.16), FOLD_B = folded(0.06);
  /* bật lên như sách pop-up: vật ở xa nằm rạp trên mặt giấy, nhân vật đi tới gần thì dựng đứng (có nảy) */
  var POPS = [], POP_UP = 5.4, POP_DOWN = 6.8;

  /* tấm giấy đứng: chân tại (gx, gy) px toàn thành phố, cỡ s px, foot = tỉ lệ chân trong khung hình */
  function card(n, gx, gy, s, foot, opt) {
    opt = opt || {};
    var g = new THREE.Group(), m = new THREE.Mesh(opt.fold === 'tree' ? FOLD_T : opt.fold === 'b' ? FOLD_B : PLANE, opt.own ? mat(n).clone() : mat(n));
    m.castShadow = true; m.receiveShadow = true; m.customDepthMaterial = dmat(n);
    m.position.y = -(1 - (foot || 0.96)) * s * U;
    g.add(m); g.scale.set(s * U, s * U, s * U); m.scale.set(1, 1, 1);
    g.position.set(gx * U, 0, gy * U); g.rotation.x = -LEAN;
    SC.add(g); g.userData.mesh = m;
    if (opt.pop !== false) {   // người, xe đi lại thì luôn đứng; mọi vật khác bật lên khi tới gần
      var pp = { g: g, a: 0, v: 0, up: false, wait: 0, x: g.position.x, z: g.position.z, jit: Math.random() * 0.12 };
      g.rotation.x = -Math.PI / 2; g.userData.pop = pp; POPS.push(pp);
    }
    return g;
  }
  /* bóng mềm dưới chân (bổ sung cho bóng đổ thật) */
  var blobTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 64; var x = c.getContext('2d');
    var gr = x.createRadialGradient(32, 32, 2, 32, 32, 31); gr.addColorStop(0, 'rgba(40,25,10,.45)'); gr.addColorStop(1, 'rgba(40,25,10,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
  })();
  var BLOBM = new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false });
  var BLOBG = new THREE.PlaneGeometry(1, 1); BLOBG.rotateX(-Math.PI / 2);
  function blob(r) { var b = new THREE.Mesh(BLOBG, BLOBM); b.scale.set(r * 2, 1, r * 0.9); b.position.y = 0.012; SC.add(b); return b; }

  /* ---------- mặt đất: nền giấy rộng + tờ bản đồ từng khu ---------- */
  var paper = tex('paper_tile.webp'); paper.wrapS = paper.wrapT = THREE.RepeatWrapping; paper.repeat.set(26, 18);
  var base = new THREE.Mesh(new THREE.PlaneGeometry(140, 100), new THREE.MeshLambertMaterial({ map: paper, color: 0xd9e4c0 }));
  base.rotation.x = -Math.PI / 2; base.position.set(7.68, -0.01, 5.12); base.receiveShadow = true; SC.add(base);
  var SCN = {};
  DIST.forEach(function (d) {
    var s = G.SCENES[d.id]; SCN[d.id] = s; d.s = s;
    var gm = new THREE.Mesh(new THREE.PlaneGeometry(s.w * U, s.h * U), new THREE.MeshLambertMaterial({ map: tex(s.bg) }));
    gm.rotation.x = -Math.PI / 2; gm.position.set((d.ox + s.w / 2) * U, 0, (d.oy + s.h / 2) * U); gm.receiveShadow = true; SC.add(gm);
  });

  /* bóng mây trôi trên mặt đất */
  var cloudTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 256; var x = c.getContext('2d');
    for (var i = 0; i < 9; i++) {
      var cx = Math.random() * 256, cy = Math.random() * 256, r = 30 + Math.random() * 50;
      for (var ox = -256; ox <= 256; ox += 256) for (var oy = -256; oy <= 256; oy += 256) {
        var gr = x.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, r); gr.addColorStop(0, 'rgba(30,30,50,.55)'); gr.addColorStop(1, 'rgba(30,30,50,0)');
        x.fillStyle = gr; x.beginPath(); x.arc(cx + ox, cy + oy, r, 0, 6.283); x.fill();
      }
    }
    var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 2); return t;
  })();
  var clouds = new THREE.Mesh(new THREE.PlaneGeometry(140, 100), new THREE.MeshBasicMaterial({ map: cloudTex, transparent: true, opacity: 0.16, depthWrite: false }));
  clouds.rotation.x = -Math.PI / 2; clouds.position.set(7.68, 0.02, 5.12); SC.add(clouds);

  /* ---------- toà nhà, đồ vật, người đứng ---------- */
  var BUILD = [], SWAY = [], LAMPS = [], FADE = [], STAND = [], PLATES = [], TLS = [];
  function glowTex() {
    var c = document.createElement('canvas'); c.width = c.height = 128; var x = c.getContext('2d');
    var gr = x.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,220,140,1)'); gr.addColorStop(0.3, 'rgba(255,200,110,.5)'); gr.addColorStop(1, 'rgba(255,190,90,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
  }
  var GLOW = glowTex();
  function plate(text, gx, gy, pop) {   // biển tên nổi (luôn quay về phía camera); pop: hiện theo vật đã dựng
    var c = document.createElement('canvas'), x = c.getContext('2d'); x.font = '800 44px -apple-system, system-ui, sans-serif';
    var w = Math.ceil(x.measureText(text).width) + 56; c.width = w; c.height = 72; x = c.getContext('2d');
    x.fillStyle = 'rgba(27,33,64,.86)'; x.beginPath(); if (x.roundRect) x.roundRect(0, 0, w, 72, 36); else x.rect(0, 0, w, 72); x.fill();
    x.fillStyle = '#fff'; x.font = '800 44px -apple-system, system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, 38);
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
    sp.scale.set(w / 72 * 0.24, 0.24, 1); sp.position.set(gx * U, 0.16, gy * U + 0.25); sp.renderOrder = 10; sp.userData.pop = pop; SC.add(sp); PLATES.push(sp); return sp;
  }
  DIST.forEach(function (d) {
    var s = d.s;
    (s.buildings || []).forEach(function (b) {
      var S = b.s || 300, g = card(b.img, d.ox + b.x, d.oy + b.y, S, 0.975, { own: true, fold: 'b' });
      FADE.push(g); blob(S * U * 0.38).position.set((d.ox + b.x) * U, 0.012, (d.oy + b.y - 10) * U);
      BUILD.push({ name: b.name, x: (d.ox + b.x) * U, z: (d.oy + b.y + 20) * U, b: b });
      plate(b.name, d.ox + b.x, d.oy + b.y + 26, g.userData.pop);
    });
    (s.props || []).forEach(function (p) {
      var g = card(p.img, d.ox + p.x, d.oy + p.y, p.s, 0.96, { own: /tree|fountain/.test(p.img), fold: /tree|bush/.test(p.img) ? 'tree' : /fountain|kiosk|cart|news/.test(p.img) ? 'b' : null });
      if (/tree/.test(p.img)) { SWAY.push({ g: g, ph: Math.random() * 6, k: 0.6 + Math.random() * 0.5 }); FADE.push(g); }
      if (/traffic_light/.test(p.img)) TLS.push({ x: (d.ox + p.x) * U, z: (d.oy + p.y) * U, s: p.s, lx: d.ox + p.x, pop: g.userData.pop });
      if (/lamp/.test(p.img)) {
        var gl = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 }));
        gl.scale.set(0.9, 0.9, 1); gl.position.set((d.ox + p.x) * U, p.s * U * 0.82, (d.oy + p.y) * U - 0.25); SC.add(gl);
        var pool = new THREE.Mesh(BLOBG, new THREE.MeshBasicMaterial({ map: GLOW, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 }));
        pool.scale.set(2.2, 1, 1.4); pool.position.set((d.ox + p.x) * U, 0.015, (d.oy + p.y) * U + 0.1); SC.add(pool);
        gl.userData.pop = pool.userData.pop = g.userData.pop; LAMPS.push(gl, pool);
      }
    });
    ((G.PEOPLE && G.PEOPLE[d.id]) || []).forEach(function (o) {
      var n = G.NPCS[o.npc];
      if (o.bimg) { var bs = o.bs || 210, g = card(o.bimg, d.ox + o.x, d.oy + o.y + 14, bs, 0.975, { own: true, fold: 'b' }); FADE.push(g); BUILD.push({ name: o.stall, x: (d.ox + o.x) * U, z: (d.oy + o.y + 34) * U, b: o }); plate((o.icon || '') + ' ' + o.stall, d.ox + o.x, d.oy + o.y + 40, g.userData.pop); return; }
      if (!n || !n.img) return;
      var py = o.stall ? o.y - (o.simg ? 58 : 40) : o.y;
      var simg = !o.stall && has('walk_' + o.npc + '_down.png') ? 'walk_' + o.npc + '_down.png' : n.img;
      var np = card(simg, d.ox + o.x, d.oy + py, 124, 0.957); blob(0.22).position.set((d.ox + o.x) * U, 0.012, (d.oy + py) * U);
      STAND.push({ g: np, ph: Math.random() * 6 });
      if (o.simg) { var cs = o.ss || 280; card(o.simg, d.ox + o.x, d.oy + o.y + 12, cs, 0.975); }
      plate(n.name, d.ox + o.x, d.oy + py + 22, np.userData.pop);
    });
  });

  /* ---------- va chạm (giống game 2D: lớp chặn ảnh nền, toà nhà, đồ vật, người đứng) ---------- */
  var MASK = {};
  function maskOf(s) {
    if (MASK[s.bg] !== undefined) return MASK[s.bg];
    var src = G.WALKMASK && G.WALKMASK[s.bg]; if (!src) return (MASK[s.bg] = null);
    var rows = src.r, w = rows[0].length * 4, a = [];
    for (var y = 0; y < rows.length; y++) for (var x = 0; x < w; x++) a.push((parseInt(rows[y].charAt(x >> 2), 16) >> (3 - (x & 3))) & 1);
    return (MASK[s.bg] = { c: src.c, w: w, h: rows.length, a: a });
  }
  function blockedIn(s, id, x, y) {
    var i;
    if (s.buildings) for (i = 0; i < s.buildings.length; i++) { var b = s.buildings[i], bk = (b.s || 300) / 300; if (x > b.x - 125 * bk && x < b.x + 125 * bk && y > b.y - 190 * bk && y < b.y - 4) return true; }
    if (s.props) for (i = 0; i < s.props.length; i++) { var pr = s.props[i], dx = x - pr.x, dy = (y - pr.y) * 2; if (dx * dx + dy * dy < pr.r * pr.r) return true; }
    var PP = (G.PEOPLE && G.PEOPLE[id]) || [];
