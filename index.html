<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>ConnectLife</title>
<meta name="description" content="Một app duy nhất để học tiếng Anh, tiếng Trung và đọc song ngữ, 2 tiếng mỗi ngày.">
<meta name="theme-color" content="#1a1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ConnectLife">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/atlas.css">

<!-- Khai báo sẵn để tải song song ngay từ lúc đọc HTML, khỏi nối đuôi nhiều lượt đi về. -->
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/data.js">
<link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/audio.js">
<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/srs.js">
<link rel="modulepreload" href="js/plan.js">
<link rel="modulepreload" href="js/content.js">
<link rel="modulepreload" href="js/views/home.js">
<link rel="preload" as="fetch" href="data/curriculum/index.json" crossorigin>
</head>
<body>

<div id="boot" class="boot">
  <img class="boot-logo" src="img/logo-banner.png" alt="ConnectLife">
  <div class="boot-msg" id="boot-msg">Đang tải dữ liệu…</div>
</div>

<header id="topbar" class="topbar" hidden>
  <button class="icon-btn" id="btn-back" aria-label="Quay lại">‹</button>
  <div class="topbar-title" id="topbar-title">ConnectLife</div>
  <button class="icon-btn" id="btn-report" aria-label="Báo lỗi nội dung màn hình này" title="Báo lỗi màn hình này">⚑</button>
  <a class="icon-btn" id="btn-search" href="#/search" aria-label="Tra từ"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg></a>
  <button class="icon-btn" id="btn-settings" aria-label="Cài đặt">⚙</button>
  <a class="day-ring" id="day-ring" href="#/home" aria-label="Tiến độ hôm nay" hidden><span class="dr-ring"><b id="dr-pct">0%</b></span><span class="dr-txt"><b id="dr-min">0′</b><small id="dr-sub">hôm nay</small></span></a>
</header>

<main id="view" class="view" hidden></main>

<nav id="tabbar" class="tabbar" hidden>
  <a href="#/home"  class="tab" data-tab="home"><span class="tab-ico">☀</span><span>Hôm nay</span><em class="badge" id="due-badge" hidden>0</em></a>
  <a href="#/en"    class="tab" data-tab="en"><span class="tab-ico">Aa</span><span>Tiếng Anh</span></a>
  <a href="#/zh"    class="tab" data-tab="zh"><span class="tab-ico cn">汉</span><span>Tiếng Trung</span></a>
  <a href="#/lib"   class="tab" data-tab="lib"><span class="tab-ico">▤</span><span>Chủ đề</span></a>
  <a href="#/stats" class="tab" data-tab="stats"><span class="tab-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg></span><span>Tiến độ</span></a>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" id="sheet-panel"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
